<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1110 655" width="1110" height="655" role="img"><rect x="-30" y="-30" width="1110" height="655" fill="#ffffff"/><text x="330" y="36" font-size="36" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">Stage 1: Spec</text><text x="210" y="77" font-size="22" fill="#757575" font-family="Segoe UI, Helvetica, Arial, sans-serif">Decide what to build before any code is written</text><rect x="0" y="200" width="210" height="110" rx="14" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" opacity="1"/><text x="105" y="250" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Idea</text><text x="105" y="275" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">your request</text><polyline points="210,255 280,255" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><polygon points="280,255 269.1946347717679,260.21958640933474 269.1946347717679,249.78041359066523" fill="#1e1e1e"/><rect x="280" y="200" width="210" height="110" rx="14" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" opacity="1"/><text x="385" y="250" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Brainstorm</text><text x="385" y="275" font-size="20" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">intent + options</text><polyline points="490,255 560,255" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><polygon points="560,255 549.1946347717678,260.21958640933474 549.1946347717678,249.78041359066523" fill="#1e1e1e"/><rect x="560" y="200" width="210" height="110" rx="14" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2" opacity="1"/><text x="665" y="250.5" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Spec</text><text x="665" y="273" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">docs/superpowers/specs</text><text x="753" y="178" font-size="18" fill="#15803d" font-family="Segoe UI, Helvetica, Arial, sans-serif">you approve</text><polyline points="770,255 840,255" fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/><polygon points="840,255 829.1946347717678,260.21958640933474 829.1946347717678,249.78041359066523" fill="#22c55e"/><rect x="840" y="200" width="210" height="110" rx="14" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" opacity="1"/><text x="945" y="250.5" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Plan</text><text x="945" y="273" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">docs/superpowers/plans</text><polyline points="665,310 665,410" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 8" stroke-linejoin="round"/><polygon points="665,410 659.7804135906653,399.1946347717679 670.2195864093347,399.1946347717679" fill="#f59e0b"/><text x="690" y="363" font-size="18" fill="#9a6700" font-family="Segoe UI, Helvetica, Arial, sans-serif">hard to reverse?</text><rect x="560" y="410" width="210" height="100" rx="14" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2" opacity="1"/><text x="665" y="455.5" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">ADR</text><text x="665" y="478" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">src/docs/adr</text><text x="60" y="590" font-size="20" fill="#757575" font-family="Segoe UI, Helvetica, Arial, sans-serif">Output: an approved spec and a step-by-step plan. The agent builds nothing until you approve.</text></svg>
