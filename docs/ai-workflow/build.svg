<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1110 705" width="1110" height="705" role="img"><rect x="-30" y="-30" width="1110" height="705" fill="#ffffff"/><text x="330" y="36" font-size="36" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">Stage 2: Build</text><text x="160" y="77" font-size="22" fill="#757575" font-family="Segoe UI, Helvetica, Arial, sans-serif">Isolated, convention-driven work with tests in the same commit</text><rect x="0" y="200" width="210" height="130" rx="14" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" opacity="1"/><text x="105" y="249.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Worktree</text><text x="105" y="271.75" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">.worktrees/&lt;name&gt;</text><text x="105" y="294.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">one branch each</text><polyline points="210,265 280,265" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><polygon points="280,265 269.1946347717679,270.21958640933474 269.1946347717679,259.78041359066526" fill="#1e1e1e"/><rect x="280" y="200" width="210" height="130" rx="14" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2" opacity="1"/><text x="385" y="249.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Load skills</text><text x="385" y="271.75" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">.claude/skills/*</text><text x="385" y="294.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">indexed in CLAUDE.md</text><polyline points="490,265 560,265" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><polygon points="560,265 549.1946347717678,270.21958640933474 549.1946347717678,259.78041359066526" fill="#1e1e1e"/><rect x="560" y="200" width="210" height="130" rx="14" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" opacity="1"/><text x="665" y="249.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Code + tests</text><text x="665" y="271.75" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">every changed file</text><text x="665" y="294.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">ships its tests</text><polyline points="770,265 840,265" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/><polygon points="840,265 829.1946347717678,270.21958640933474 829.1946347717678,259.78041359066526" fill="#1e1e1e"/><rect x="840" y="200" width="210" height="130" rx="14" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2" opacity="1"/><text x="945" y="249.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Commit</text><text x="945" y="271.75" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">Conventional Commits</text><text x="945" y="294.25" font-size="18" fill="#1e1e1e" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">feat(scope): subject</text><rect x="0" y="420" width="1050" height="150" rx="14" fill="#ffc9c9" stroke="#ef4444" stroke-width="1" opacity="0.4"/><text x="20" y="454" font-size="22" fill="#b91c1c" font-family="Segoe UI, Helvetica, Arial, sans-serif">Guardrails</text><text x="20" y="493" font-size="18" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">pre-commit hook rejects commits on main and from the primary checkout</text><text x="20" y="528" font-size="18" fill="#1e1e1e" font-family="Segoe UI, Helvetica, Arial, sans-serif">pre-push hook rejects pushes to main; changes reach main only through a pull request</text><polyline points="945,330 945,415" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="10 8" stroke-linejoin="round"/><polygon points="945,415 939.7804135906653,404.1946347717679 950.2195864093347,404.1946347717679" fill="#ef4444"/><text x="60" y="640" font-size="20" fill="#757575" font-family="Segoe UI, Helvetica, Arial, sans-serif">Output: a committed branch that is ready for the sensors.</text></svg>
